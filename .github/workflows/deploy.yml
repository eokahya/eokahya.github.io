name: Verify and deploy GitHub Pages
on:
  push:
  workflow_dispatch:
  schedule:
    # Mondays 06:23 in Istanbul: renew the YouTube view counts and redeploy.
    - cron: '23 3 * * 1'
env:
  ASTRO_TELEMETRY_DISABLED: 1
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    # Only the user-site repository's default branch is ever published (scheduled runs use that branch).
    if: github.repository == 'eokahya/eokahya.github.io' && (github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Never fails the build: if YouTube cannot be read, the committed snapshot and its date are kept.
      # Needs the YOUTUBE_API_KEY repository secret: YouTube shows bot checks to GitHub's servers.
      - name: Refresh YouTube view counts
        run: npm run refresh:views
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:secrets
      # build = astro build → syllabus PDF from the print route → internal link check → bilingual check.
      # A failure at any step stops the job before an artifact is uploaded.
      - run: npm run build
      - run: npm run check:pdf
      - run: npm run check:browser
      - name: Keep the PDF and check reports for inspection if a check failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports
          path: |
            dist/teaching/myz-310e/2026-fall/myz-310e-syllabus.pdf
            artifacts/pdf/
            artifacts/browser/results.json
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified artifact
        id: deployment
        uses: actions/deploy-pages@v5
  keepalive:
    # GitHub pauses scheduled workflows after 60 days without repository activity; re-enabling the
    # workflow from its own weekly run keeps the view-count refresh going.
    if: github.repository == 'eokahya/eokahya.github.io' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
