name: Verify and deploy GitHub Pages
on:
  push:
  workflow_dispatch:
env:
  ASTRO_TELEMETRY_DISABLED: 1
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    # Only the user-site repository's default branch is ever published.
    if: github.repository == 'eokahya/eokahya.github.io' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:secrets
      # build = astro build → syllabus PDF from the print route → internal link check → bilingual check.
      # A failure at any step stops the job before an artifact is uploaded.
      - run: npm run build
      - run: npm run check:pdf
      - run: npm run check:browser
      - name: Keep the PDF and check reports for inspection if a check failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports
          path: |
            dist/teaching/myz-310e/2026-fall/myz-310e-syllabus.pdf
            artifacts/pdf/
            artifacts/browser/results.json
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified artifact
        id: deployment
        uses: actions/deploy-pages@v5
